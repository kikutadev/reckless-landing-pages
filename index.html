<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#102e36">
  <meta name="description" content="エンジン停止。畑、外洋、市街地、峡谷、嵐の島。どこでも降ろせるローポリ3Dフライトアクション。">
  <title>無茶な着陸 — 飛行機をどこでも降ろせ</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script type="module" crossorigin src="./assets/index-BTw9CtuL.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-kXIzZLBH.css">
</head>
<body>
  <canvas id="game" aria-label="飛行機と着陸する世界の3D画面"></canvas>
  <div id="ui">
    <header id="masthead">
      <div class="brand">無茶な着陸<span>RECKLESS LANDING</span></div>
      <button id="pause" type="button" aria-label="一時停止" hidden>Ⅱ</button>
    </header>

    <div id="hud" hidden>
      <div class="instruments" aria-label="飛行計器">
        <div class="instrument" id="meter-alt"><small>接地まで</small><span><strong id="alt">—</strong><em>m</em></span></div>
        <div class="instrument" id="meter-speed"><small>対地速度</small><span><strong id="speed">—</strong><em>km/h</em></span></div>
        <div class="instrument" id="meter-risk"><small id="risk-label">昇降</small><span><strong id="risk-value">—</strong><em id="risk-unit">m/s</em></span></div>
      </div>
      <div class="flight-summary">
        <span id="stage-label" hidden></span>
        <span id="wind" hidden></span>
      </div>
      <div id="hud-message">
        <div id="status"></div>
        <div id="notice" role="status" aria-live="polite"></div>
      </div>
    </div>

    <section id="menu" class="panel" aria-label="スタートメニュー">
      <p class="eyebrow">ENGINE FAILURE / 緊急着陸</p>
      <h1>無茶な<span>着陸</span></h1>
      <p class="tagline">飛行機をどこでも降ろせ。</p>
      <p class="intro">畑でも、海でも、街の真ん中でも。<br>ボロボロになっても、止まれれば生還。</p>
      <p class="section-label">挑戦する地域</p>
      <div id="stage-select" role="group" aria-label="ステージ選択"></div>
      <p id="stage-desc"></p>
      <button id="start" class="primary" type="button" disabled>機体を準備中…</button>
      <p class="instructions">
        <span class="touch-guide">左スティック：下で機首上げ／左右で旋回。ブレーキは押す間だけ</span>
        <span class="keyboard-guide">← → 旋回　↓ 機首上げ　↑ 機首下げ　SPACE ブレーキ</span>
      </p>
    </section>

    <section id="result" class="panel" aria-label="着陸結果" hidden>
      <p class="eyebrow" id="result-stage"></p>
      <h2 id="result-title"></h2>
      <p id="result-desc"></p>
      <div id="result-stats"></div>
      <div class="result-actions">
        <button id="next" class="primary" type="button">次の空へ</button>
        <button id="retry" class="secondary" type="button">もう一度飛ぶ</button>
      </div>
      <button id="home" class="text-button" type="button">ステージ選択に戻る</button>
    </section>

    <section id="pause-panel" class="panel" aria-label="一時停止メニュー" hidden>
      <p class="eyebrow">FLIGHT PAUSED</p>
      <h2>一時停止</h2>
      <p class="pause-copy">再開すると、同じ高度と速度から飛行を続けます。</p>
      <button id="resume" class="primary" type="button">飛行を再開</button>
      <button id="restart" class="secondary" type="button">最初からやり直す</button>
      <button id="pause-home" class="text-button" type="button">ステージ選択に戻る</button>
    </section>

    <div id="touch" hidden>
      <div class="stick-control">
        <div id="stick" role="group" aria-label="機体を傾けるスティック"><span></span></div>
        <small>下で機首上げ</small>
      </div>
      <button id="brake" type="button" aria-label="空中は減速、接地後は停止するブレーキ"><strong>ブレーキ</strong><small>押す間</small></button>
    </div>

    <div id="loading-error" hidden></div>
    <footer id="footer">ENGINE OUT / 無事に止まれれば、生還。</footer>
  </div>
</body>
</html>
